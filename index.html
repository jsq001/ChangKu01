            <div class="flex flex-wrap items-center gap-3 text-sm bg-slate-100 px-3 py-1.5 rounded-lg">

                <label class="flex items-center gap-1.5 cursor-pointer">
                    <span class="font-medium text-slate-600">🎙️ 声音:</span>
                    <select id="voiceSelect" class="bg-white border border-slate-300 rounded px-2 py-1 text-slate-700 focus:outline-none focus:border-indigo-500 max-w-[180px] text-xs">
                        <option value="">正在加载日语语音...</option>
                    </select>
                </label>

                <!-- 语速选择 (默认 1.0x) -->
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <span class="font-medium text-slate-600">⚡ 语速:</span>
                    <select id="rateSelect" class="bg-white border border-slate-300 rounded px-2 py-1 text-slate-700 focus:outline-none focus:border-indigo-500 text-xs">
                        <option value="1.2">1.2x (快速)</option>
                        <option value="1.0" selected>1.0x (默认)</option>
                        <option value="0.85">0.85x (稍慢)</option>
                        <option value="0.7">0.7x (慢速跟读)</option>
                    </select>
                </label>

                <!-- 字体大小调节 -->
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <span class="font-medium text-slate-600">🔍 字号:</span>
                    <select id="fontSizeSelect" onchange="changeFontSize(this.value)" class="bg-white border border-slate-300 rounded px-2 py-1 text-slate-700 focus:outline-none focus:border-indigo-500 text-xs">
                        <option value="sm">小号 (紧凑)</option>
                        <option value="md" selected>标准 (默认)</option>
                        <option value="lg">大号 (舒适)</option>
                        <option value="xl">特大 (护眼)</option>
                    </select>
                </label>

                <button onclick="toggleAllRuby()" class="bg-white border border-slate-300 hover:bg-slate-50 px-2.5 py-1 rounded text-slate-700 font-medium text-xs transition">
                    🔤 显/隐假名
                </button>

                <button onclick="toggleAllTranslations()" class="bg-white border border-slate-300 hover:bg-slate-50 px-2.5 py-1 rounded text-slate-700 font-medium text-xs transition">
                    👁️ 显/隐中文
                </button>
            </div>
        </div>

                            { type: "少し", rubyHtml: "<ruby>言葉<rt>ことば</rt></ruby>は<b><ruby>少<rt>すこ</rt></ruby>し</b>ずつ<ruby>変化<rt>へんか</rt></ruby>している。", cleanText: "言葉は少しずつ変化している。", cn: "语言渐次变化。" },

                            { type: "述べる", rubyHtml: "これからこの<ruby>物質<rt>ぶっしつ</rt></ruby>の<ruby>特徴<rt>とくちょう</rt></ruby>を<b><ruby>述<rt>の</rt></ruby>べる</b>。", cleanText: "これからこの物質の特徴を述べる。", cn: "接下来阐述这种物质的特征。" },
                            { type: "行う", rubyHtml: "<ruby>大統領選挙<rt>だいとうりょうせんきょ</rt></ruby>は7<ruby>月<rt>がつ</rt></ruby>に<b><ruby>行<rt>おこな</rt></ruby>われた</b>。", cleanText: "大統領選挙は7月に行われた。", cn: "总统选举于7月份举行了。" },
                            { type: "だが", rubyHtml: "これは<ruby>難<rt>むずか</rt></ruby>しい。<b>だが</b>、<ruby>挑戦<rt>ちょうせん</rt></ruby>しよう。", cleanText: "これは難しい。だが、挑戦しよう。", cn: "很难，但还是挑战一下吧。" },
                            { type: "なぜ", rubyHtml: "<b>なぜ</b><ruby>我々<rt>われわれ</rt></ruby>は<ruby>働<rt>はたら</rt></ruby>くのだろうか。", cleanText: "なぜ我々は働くのだろうか。", cn: "我们为什么要劳动呢？" },
                            { type: "など", rubyHtml: "<ruby>金属<rt>きんぞく</rt></ruby>には<ruby>金<rt>きん</rt></ruby>や<ruby>銀<rt>ぎん</rt></ruby><b>など</b>がある。", cleanText: "金属には金や銀などがある。", cn: "金属包括金、银等。" },
                            { type: "という", rubyHtml: "それは<ruby>事故<rt>じこ</rt></ruby>だ<b>という</b>。", cleanText: "それは事故だという。", cn: "据说那是事故。" },
                            { type: "ようだ", rubyHtml: "<ruby>彼<rt>かれ</rt></ruby>の<ruby>言葉<rt>ことば</rt></ruby>は<ruby>真実<rt>しんじつ</rt></ruby>ではない<b>ようだ</b>。", cleanText: "彼の言葉は真実ではないようだ。", cn: "他的话好像不是事实。" }
                        ]
                    }
                ]
            }

        ];

        let currentLessonIndex = 0;
        let showTrans = true;
        let showRuby = true;

        // 字体大小调节逻辑
        function changeFontSize(sizeKey) {
            const root = document.documentElement;
            const sizeMap = {
                sm: { jp: '1rem', cn: '0.75rem' },        // 小号: 日文16px, 中文12px
                md: { jp: '1.125rem', cn: '0.875rem' },   // 标准: 日文18px, 中文14px
                lg: { jp: '1.35rem', cn: '1rem' },        // 大号: 日文21.6px, 中文16px
                xl: { jp: '1.6rem', cn: '1.125rem' }      // 特大: 日文25.6px, 中文18px
            };
            const target = sizeMap[sizeKey] || sizeMap.md;
            root.style.setProperty('--jp-font-size', target.jp);
            root.style.setProperty('--cn-font-size', target.cn);
        }

        // 渲染顶部课程切换标签
        function renderTabs() {
            const tabsContainer = document.getElementById('lessonTabs');
            const allBtn = `<button onclick="selectLesson(-1)" id="tab-all" class="px-3.5 py-1.5 rounded-full text-xs font-bold border border-slate-300 transition whitespace-nowrap ${currentLessonIndex === -1 ? 'tab-active' : 'bg-white text-slate-600 hover:bg-slate-100'}">📚 全部课程</button>`;
            
            const lessonBtns = lessonsData.map((lesson, idx) => `
                <button onclick="selectLesson(${idx})" id="tab-${idx}" class="px-3.5 py-1.5 rounded-full text-xs font-bold border border-slate-300 transition whitespace-nowrap ${currentLessonIndex === idx ? 'tab-active' : 'bg-white text-slate-600 hover:bg-slate-100'}">
                    ${lesson.lessonTitle}
                </button>
            `).join('');

            tabsContainer.innerHTML = allBtn + lessonBtns;
        }

        function selectLesson(index) {
            currentLessonIndex = index;
            renderTabs();
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 渲染课程内容
        function renderContent() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = '';

            const targetLessons = currentLessonIndex === -1 ? lessonsData : [lessonsData[currentLessonIndex]];

            targetLessons.forEach((lesson) => {
                const lessonHeader = document.createElement('div');
                lessonHeader.className = "pt-2 pb-1 border-b-2 border-indigo-500 flex items-center justify-between";
                lessonHeader.innerHTML = `<h2 class="text-xl font-extrabold text-indigo-950">${lesson.lessonTitle}</h2>`;
                contentArea.appendChild(lessonHeader);

                lesson.grammars.forEach((grammar) => {
                    const section = document.createElement('section');
                    section.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6";
                    
                    let examplesHtml = grammar.examples.map((ex, idx) => {
                        const cardId = `card-${grammar.id}-${idx}`;
                        const safeCleanText = ex.cleanText.replace(/'/g, "\'");
                        return `
                        <div id="${cardId}" onclick="speakJapanese('${safeCleanText}', '${cardId}')" 
                             class="group p-4 rounded-lg border border-slate-100 bg-slate-50/60 hover:bg-indigo-50/70 hover:border-indigo-200 cursor-pointer transition flex items-start gap-3.5">
                            <button class="mt-0.5 flex-shrink-0 w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center shadow-sm group-hover:scale-105 group-hover:bg-indigo-700 transition" title="点击发音">
                                🔊
                            </button>
                            <div class="flex-1">
                                <div class="jp-sentence font-medium text-slate-900 tracking-wide">
                                    <span class="text-xs font-bold text-indigo-700 bg-indigo-100 px-1.5 py-0.5 rounded mr-1.5 align-middle">${ex.type}</span>
                                    ${ex.rubyHtml}
                                </div>
                                <div class="cn-trans text-slate-500 mt-1.5" style="display: ${showTrans ? 'block' : 'none'}">${ex.cn}</div>
                            </div>
                        </div>`;
                    }).join('');

                    section.innerHTML = `
                        <div class="bg-slate-800 text-white px-5 py-3 flex items-center justify-between">
                            <h3 class="text-base font-bold tracking-wide">${grammar.title}</h3>
                        </div>
                        <div class="p-5 space-y-4">
                            <div class="bg-amber-50/90 border-l-4 border-amber-400 p-3.5 text-sm text-slate-700 space-y-1.5 rounded-r">
                                <div><span class="font-bold text-amber-900">【接续】</span> ${grammar.connection}</div>
                                <div><span class="font-bold text-amber-900">【说明】</span> ${grammar.explanation}</div>
                            </div>
                            <div class="space-y-3">
                                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">👇 点击任意例句即可点读发音：</div>
                                ${examplesHtml}
                            </div>
                        </div>
                    `;
                    contentArea.appendChild(section);
                });
            });
            applyRubyVisibility();
        }

        // === 自动加载系统中的日语发音人，并强制优先锁定 Nanami ===
        let availableVoices = [];

        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
            const voiceSelect = document.getElementById('voiceSelect');
            if (!voiceSelect) return;

            const jpVoices = availableVoices.filter(v => v.lang.includes('ja') || v.lang.includes('JP'));

            voiceSelect.innerHTML = '';
            if (jpVoices.length === 0) {
                voiceSelect.innerHTML = '<option value="">Nanami (系统默认日语)</option>';
                return;
            }

            // 将包含 Nanami 的声音排在最前面
            jpVoices.sort((a, b) => {
                const aIsNanami = a.name.toLowerCase().includes('nanami') ? -1 : 0;
                const bIsNanami = b.name.toLowerCase().includes('nanami') ? -1 : 0;
                return aIsNanami - bIsNanami;
            });

            jpVoices.forEach((voice) => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.textContent = voice.name
                    .replace('Microsoft ', '')
                    .replace(' Online (Natural)', ' 🌟(超自然)')
                    .replace(' - Japanese (Japan)', '');
                voiceSelect.appendChild(option);
            });

            // 严格按照优先级选择默认声音：1. Nanami Natural -> 2. 任意 Nanami -> 3. 其他 Natural -> 4. 其他优质日语音源
            const nanamiNatural = jpVoices.find(v => v.name.includes('Nanami') && v.name.includes('Natural'));
            const nanamiAny = jpVoices.find(v => v.name.toLowerCase().includes('nanami'));
            const otherNatural = jpVoices.find(v => v.name.includes('Natural') || v.name.includes('Keita') || v.name.includes('Kyoko') || v.name.includes('Google 日本語'));

            const defaultVoice = nanamiNatural || nanamiAny || otherNatural || jpVoices[0];
            if (defaultVoice) {
                voiceSelect.value = defaultVoice.name;
            }
        }

        window.speechSynthesis.onvoiceschanged = loadVoices;
        setTimeout(loadVoices, 100);

        // === 语音点读核心函数 ===
        function speakJapanese(text, cardId) {
            if (!('speechSynthesis' in window)) {
                alert("抱歉，您的浏览器不支持语音朗读功能，建议使用 Edge 或 Chrome 浏览器打开。");
                return;
            }
            window.speechSynthesis.cancel();
            
            document.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            // 获取语速，默认 1.0 倍
            utterance.rate = parseFloat(document.getElementById('rateSelect').value) || 1.0;

            const selectedVoiceName = document.getElementById('voiceSelect').value;
            let selectedVoice = availableVoices.find(v => v.name === selectedVoiceName);
            
            // 如果尚未手动选择，再次兜底寻找 Nanami
            if (!selectedVoice && availableVoices.length > 0) {
                selectedVoice = availableVoices.find(v => v.name.toLowerCase().includes('nanami')) || availableVoices.find(v => v.lang.includes('ja'));
            }
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            const cardEl = document.getElementById(cardId);
            if (cardEl) cardEl.classList.add('playing');

            utterance.onend = () => {
                if (cardEl) cardEl.classList.remove('playing');
            };
            utterance.onerror = () => {
                if (cardEl) cardEl.classList.remove('playing');
            };

            window.speechSynthesis.speak(utterance);
        }

        // 一键显示/隐藏中文翻译
        function toggleAllTranslations() {
            showTrans = !showTrans;
            document.querySelectorAll('.cn-trans').forEach(el => {
                el.style.display = showTrans ? 'block' : 'none';
            });
        }

        // 一键显示/隐藏假名注音 (方便测试汉字读音)
        function toggleAllRuby() {
            showRuby = !showRuby;
            applyRubyVisibility();
        }

        function applyRubyVisibility() {
            document.querySelectorAll('rt').forEach(el => {
                el.style.visibility = showRuby ? 'visible' : 'hidden';
            });
        }

        // 初始化渲染
        renderTabs();
        renderContent();
    </script>
</body>
</html>
